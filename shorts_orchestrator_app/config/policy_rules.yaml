policy_rules:
  require_manual_approval_before:
    - youtube_upload_public
    - youtube_upload_unlisted
    - youtube_upload_scheduled_public
    - deleting_files
    - sending_external_messages
    - spending_money
  default_upload_privacy: private
  hard_reject_if:
    - copied third-party clip without permission
    - celebrity or real-person likeness without clear rights
    - cloned real-person voice without consent
    - copyrighted character/franchise as main subject
    - mass-produced near-identical template with no meaningful change
    - violent, sexual, hateful, harassing, or dangerous content
    - misleading photorealistic event or emergency
  copyright_rules:
    - Do not download and repost random videos from YouTube, TikTok, Twitch, or Instagram.
    - Use original footage, licensed footage, Creative Commons sources with attribution, or footage with written permission.
    - For VTuber content, prefer original virtual-host commentary. Use creator clips only where policy allows it and add meaningful commentary.
    - Avoid music unless it is licensed, royalty-free, generated by you with clear rights, or from YouTube's approved library.
  monetization_rules:
    - Reject no-commentary compilations.
    - Reject mass-produced template videos with minimal variation.
    - Reject videos that are only readings of copied text or news feeds.
    - Require visible or audible original contribution: voiceover, explanation, storyline, education, critique, or original AI visuals with human-curated concept.
  ai_rules:
    - If realistic AI creates or changes a real person/event/place, mark AI disclosure required.
    - Do not impersonate real people or make them appear to say/do things they did not do.
    - Prefer unrealistic, animated, abstract, or clearly fictional AI visuals for low monetization risk.
    - Keep a generation log: trend source, prompt packet, model used, output path, review status, and upload status.
