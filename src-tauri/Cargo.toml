[package]
name = "mordu-market-engine"
version = "1.0.0"
description = "Mordu Market Engine - EVE Online Trading Intelligence"
authors = ["Mordu Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-sidecar", "shell-open", "http-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
